<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Employee Management System</title>
    <style>
        .error { color: red; font-size: 12px; }
        body { font-family: Arial, sans-serif; margin: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid black; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>
    <h2>Employee Management System</h2>

    <!-- Create Employee Form -->
    <form th:action="@{/employees}" th:object="${employee}" method="post">
        <label>Full Name:</label>
        <input type="text" th:field="*{fullName}" />
        <span th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}" class="error"></span><br><br>

        <label>Email:</label>
        <input type="text" th:field="*{email}" />
        <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="error"></span><br><br>

        <label>Phone:</label>
        <input type="text" th:field="*{phone}" />
        <span th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}" class="error"></span><br><br>

        <label>Department:</label>
        <input type="text" th:field="*{department}" />
        <span th:if="${#fields.hasErrors('department')}" th:errors="*{department}" class="error"></span><br><br>

        <label>Salary:</label>
        <input type="text" th:field="*{salary}" />
        <span th:if="${#fields.hasErrors('salary')}" th:errors="*{salary}" class="error"></span><br><br>

        <button type="submit">Save Employee</button>
    </form>

    <hr>

    <!-- Employees Table -->
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Full Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Department</th>
                <th>Salary</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="emp : ${listEmployees}">
                <td th:text="${emp.id}"></td>
                <td th:text="${emp.fullName}"></td>
                <td th:text="${emp.email}"></td>
                <td th:text="${emp.phone}"></td>
                <td th:text="${emp.department}"></td>
                <td th:text="${emp.salary}"></td>
                <td>
                    <!-- Edit & Delete Buttons -->
                    <a th:href="@{/employees/{id}/edit(id=${emp.id})}"><button>Edit</button></a>
                    <form th:action="@{/employees/{id}/delete(id=${emp.id})}" method="post" style="display:inline;">
                        <button type="submit" onclick="return confirm('Are you sure you want to delete this employee?')">Delete</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
