<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Employee</title>
    <style>
        .error { color: red; font-size: 12px; }
        body { font-family: Arial, sans-serif; margin: 20px; }
    </style>
</head>
<body>
    <h2>Edit Employee</h2>

    <form th:action="@{/employees/{id}/update(id=${employee.id})}" th:object="${employee}" method="post">
        <label>Full Name:</label>
        <input type="text" th:field="*{fullName}" />
        <span th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}" class="error"></span><br><br>

        <label>Email:</label>
        <input type="text" th:field="*{email}" />
        <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="error"></span><br><br>

        <label>Phone:</label>
        <input type="text" th:field="*{phone}" />
        <span th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}" class="error"></span><br><br>

        <label>Department:</label>
        <input type="text" th:field="*{department}" />
        <span th:if="${#fields.hasErrors('department')}" th:errors="*{department}" class="error"></span><br><br>

        <label>Salary:</label>
        <input type="text" th:field="*{salary}" />
        <span th:if="${#fields.hasErrors('salary')}" th:errors="*{salary}" class="error"></span><br><br>

        <button type="submit">Update Employee</button>
    </form>
    
    <br>
    <a th:href="@{/employees}">Back to List</a>
</body>
</html>
